name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e .
          pip install pytest
      - name: Run tests
        run: PYTHONPATH=src pytest -q
      - name: Smoke test on examples
        run: |
          str-listing-audit examples/example_listing.json
          str-listing-audit examples/example_listing_poor.json --output /tmp/report.md || true
