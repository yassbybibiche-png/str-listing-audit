[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "str-listing-audit"
version = "0.1.0"
description = "Evidence-based audit toolkit for short-term rental listings (Airbnb, Booking, Vrbo)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Yassine Osmani" }]
keywords = ["airbnb", "short-term-rental", "listing-audit", "concierge", "property-management"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
str-listing-audit = "str_listing_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
